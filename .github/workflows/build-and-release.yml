name: Build and Release

on:
  push:
    tags:
      - 'release/v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  PLUGIN_NAME: "Orbitals"
  PLUGIN_DLL_NAME: "NINA.Joko.Plugin.Orbitals"
  PLUGIN_MANIFEST_PATH: "o/Orbitals/3.3.0"
  PLUGIN_IS_BETA: false

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version from tag
        run: |
          $version = "${{ github.ref_name }}" -replace '^release/v', ''
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Prepare folders
        run: |
          New-Item -ItemType Directory -Force -Path "packages/${{ env.PLUGIN_NAME }}"

      - name: Build .NET Assemblies
        run: |
          dotnet restore "NINA.Joko.Plugin.Orbitals/NINA.Joko.Plugin.Orbitals.csproj"
          # AssemblyInfo.cs is the source of truth for AssemblyVersion (GenerateAssemblyInfo=false
          # in the csproj), so don't pass -p:Version — it would be silently ignored and could
          # mislead future maintainers into thinking the tag controls the embedded version.
          dotnet build "NINA.Joko.Plugin.Orbitals/NINA.Joko.Plugin.Orbitals.csproj" -c Release -p:Platform=AnyCPU -p:PostBuildEvent=

      - name: Prepare package
        run: |
          $buildOut = "NINA.Joko.Plugin.Orbitals/bin/Release/net10.0-windows7.0"
          Copy-Item "$buildOut/${{ env.PLUGIN_DLL_NAME }}.dll" "packages/${{ env.PLUGIN_NAME }}/" -Force
          Copy-Item "$buildOut/${{ env.PLUGIN_DLL_NAME }}.pdb" "packages/${{ env.PLUGIN_NAME }}/" -Force
          Copy-Item "$buildOut/protobuf-net*.dll" "packages/${{ env.PLUGIN_NAME }}/" -Force
          Copy-Item "$buildOut/TrieNet*.dll" "packages/${{ env.PLUGIN_NAME }}/" -Force -ErrorAction SilentlyContinue
          Copy-Item "$buildOut/FlatFiles*.dll" "packages/${{ env.PLUGIN_NAME }}/" -Force
          Copy-Item "$buildOut/Mindbox.Data.Linq.dll" "packages/${{ env.PLUGIN_NAME }}/" -Force
          Copy-Item "$buildOut/SGP.NET.dll" "packages/${{ env.PLUGIN_NAME }}/" -Force

      - name: Create Plugin archives and manifests
        run: |
          curl -LO "https://raw.githubusercontent.com/isbeorn/nina.plugin.manifests/refs/heads/main/tools/CreateManifest.ps1?raw=true"
          if ($env:PLUGIN_IS_BETA -eq "true") {
            pwsh CreateManifest.ps1 -file "packages/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_DLL_NAME }}.dll" -beta -installerUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.PLUGIN_DLL_NAME }}.${{ env.VERSION }}.zip" -createArchive -includeAll -appendVersionToArchive
          } else {
            pwsh CreateManifest.ps1 -file "packages/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_DLL_NAME }}.dll" -installerUrl "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.PLUGIN_DLL_NAME }}.${{ env.VERSION }}.zip" -createArchive -includeAll -appendVersionToArchive
          }
          Rename-Item -Path "manifest.json" -NewName "${{ env.PLUGIN_DLL_NAME }}.${{ env.VERSION }}.manifest.json"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            ./${{ env.PLUGIN_DLL_NAME }}.${{ env.VERSION }}.zip
            ./${{ env.PLUGIN_DLL_NAME }}.${{ env.VERSION }}.manifest.json

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-manifest
          path: ${{ env.PLUGIN_DLL_NAME }}.${{ env.VERSION }}.manifest.json

  check-repo-exists:
    runs-on: ubuntu-latest
    needs: build-and-release
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if repo exists
        id: check
        run: |
          REPO="nina.plugin.manifests"
          OWNER="${{ github.repository_owner }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.github.com/repos/$OWNER/$REPO)
          if [ "$STATUS" -eq 200 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  publish-manifest:
    runs-on: ubuntu-latest
    needs: [check-repo-exists, build-and-release]
    if: needs.check-repo-exists.outputs.exists == 'true'
    steps:
      - name: Download manifest artifact
        uses: actions/download-artifact@v8
        with:
          name: plugin-manifest

      - name: Extract version from tag
        run: echo "VERSION=$(echo '${{ github.ref_name }}' | sed 's|release/v||')" >> $GITHUB_ENV

      - name: Sanitize PLUGIN_NAME
        run: echo "PLUGIN_NAME_SANITIZED=${PLUGIN_NAME//[[:space:]]/}" >> $GITHUB_ENV

      - name: Clone manifest repo
        run: |
          git clone https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository_owner }}/nina.plugin.manifests.git
          cd nina.plugin.manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/isbeorn/nina.plugin.manifests.git
          git fetch upstream
          git reset --hard upstream/main
          git push origin main
          git checkout -b "${{ env.PLUGIN_NAME_SANITIZED }}/${{ github.ref_name }}"

      - name: Copy manifest file
        run: |
          mkdir -p "./nina.plugin.manifests/manifests/${{ env.PLUGIN_MANIFEST_PATH }}"
          cp "./${{ env.PLUGIN_DLL_NAME }}.${{ env.VERSION }}.manifest.json" "./nina.plugin.manifests/manifests/${{ env.PLUGIN_MANIFEST_PATH }}/manifest.json"
          cd nina.plugin.manifests
          git add .
          git commit -m "Add manifest for release ${{ env.VERSION }}"
          git push --force origin "${{ env.PLUGIN_NAME_SANITIZED }}/${{ github.ref_name }}"

      - name: Create pull request
        shell: bash
        run: |
          echo "${{ secrets.PAT }}" | gh auth login --with-token
          gh pr create \
            --title "Add manifest for ${{ env.PLUGIN_NAME }} ${{ env.VERSION }}" \
            --body "Automatically generated manifest for release ${{ env.VERSION }}" \
            --head ${{ github.repository_owner }}:${{ env.PLUGIN_NAME_SANITIZED }}/${{ github.ref_name }} \
            --base main \
            --repo isbeorn/nina.plugin.manifests
